# depdash-managed: do not edit — generator v1
# app: default
name: depdash-deploy
on:
  push:
    branches: ['dev']
  workflow_dispatch:

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd /var/www/cirunnertest.customerdemourl.com
          git stash
          git pull origin dev
          sudo chown -R oesadmin:oesadmin /var/www/cirunnertest.customerdemourl.com
          export NVM_DIR="/home/oesadmin/.nvm"
          source ~/.nvm/nvm.sh 
          nvm use v22.12.0
          npm i
      - name: Package artifact
        run: tar -czf artifact.tar.gz --exclude=node_modules/.cache --exclude=.git .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depdash-artifact
          path: artifact.tar.gz
      - name: Notify depdash
        env:
          DEPDASH_CALLBACK_SECRET: ${{ secrets.DEPDASH_CALLBACK_3EDDAE6C_905D_4178_A09D_4D69A109DE03 }}
        run: |
          BODY=$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg status "success" --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ runId: $run, gitSha: $sha, status: $status, runUrl: $runurl }')
          SIG=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$DEPDASH_CALLBACK_SECRET" -binary | xxd -p -c 256)
          curl -fsS -X POST -H "content-type: application/json" -H "x-depdash-sig: sha256=$SIG" -d "$BODY" 'http://localhost:3000/webhooks/ci-result?pipelineId=3eddae6c-905d-4178-a09d-4d69a109de03'
