# depdash-managed: do not edit — generator v1
# app: default
name: depdash-deploy
on:
  push:
    branches: ['dev']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'v22.12.0'
      - name: Install dependencies
        run: npm install
      - name: Package artifact
        run: STAGE=$(mktemp -d) && tar -czf "$STAGE/artifact.tar.gz" --exclude=node_modules/.cache --exclude=.git . && mv "$STAGE/artifact.tar.gz" . && rm -rf "$STAGE"
      - name: Deploy over SSH
        env:
          DEPDASH_SSH_KEY: ${{ secrets.DEPDASH_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/depdash_deploy_key
          echo "$DEPDASH_SSH_KEY" > /tmp/depdash_deploy_key
          cat > /tmp/depdash_remote.sh <<'REMOTE_SCRIPT'
          set -e
          mkdir -p '${{ secrets.DEPDASH_DEPLOY_PATH }}'
          mv /tmp/artifact.tar.gz '${{ secrets.DEPDASH_DEPLOY_PATH }}/artifact.tar.gz'
          cd '${{ secrets.DEPDASH_DEPLOY_PATH }}'
          tar -xzf artifact.tar.gz
          pm2 describe '${{ secrets.DEPDASH_PM2_APP }}' >/dev/null 2>&1 && pm2 reload '${{ secrets.DEPDASH_PM2_APP }}' --update-env || pm2 start 'export NVM_DIR="/home/oesadmin/.nvm"
          source ~/.nvm/nvm.sh 
          pm2 describe testtodorunner.customerdemourl.com > /dev/null \
            && pm2 reload testtodorunner.customerdemourl.com --update-env \
            || pm2 start app.js --name testtodorunner.customerdemourl.com --time
          
          pm2 save' --name '${{ secrets.DEPDASH_PM2_APP }}' --interpreter bash --time
          pm2 save
          REMOTE_SCRIPT
          scp -i /tmp/depdash_deploy_key -o StrictHostKeyChecking=no -P ${{ secrets.DEPDASH_SSH_PORT || 22 }} \
            artifact.tar.gz /tmp/depdash_remote.sh "${{ secrets.DEPDASH_SSH_USER }}@${{ secrets.DEPDASH_SSH_HOST }}:/tmp/"
          ssh -i /tmp/depdash_deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.DEPDASH_SSH_PORT || 22 }} \
            "${{ secrets.DEPDASH_SSH_USER }}@${{ secrets.DEPDASH_SSH_HOST }}" \
            "bash /tmp/depdash_remote.sh && rm -f /tmp/depdash_remote.sh"
          rm -f /tmp/depdash_deploy_key
      - name: Notify depdash
        env:
          DEPDASH_CALLBACK_SECRET: ${{ secrets.DEPDASH_CALLBACK_74E28DC9_493E_4853_9A90_10B27A5BBB8D }}
        run: |
          BODY=$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg status "success" --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ runId: $run, gitSha: $sha, status: $status, runUrl: $runurl }')
          SIG=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$DEPDASH_CALLBACK_SECRET" -binary | xxd -p -c 256)
          curl -fsS -X POST -H "content-type: application/json" -H "x-depdash-sig: sha256=$SIG" -d "$BODY" 'https://depdash.customerdemourl.com/api/webhooks/ci-result?pipelineId=74e28dc9-493e-4853-9a90-10b27a5bbb8d'
