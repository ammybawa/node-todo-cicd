# depdash-managed: do not edit — generator v1
# app: default
name: depdash-deploy
on:
  push:
    branches: ['dev']
  workflow_dispatch:

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd /var/www/deprunner.customerdemourl.com
          git stash
          git pull origin master
          sudo chown -R oesadmin:oesadmin /var/www/deprunner.customerdemourl.com
          export NVM_DIR="/home/oesadmin/.nvm"
          source ~/.nvm/nvm.sh 
          nvm use v22.12.0
          npm i
      - name: Package artifact
        run: tar -czf artifact.tar.gz --exclude=node_modules/.cache --exclude=.git .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depdash-artifact
          path: artifact.tar.gz
      - name: Deploy (SSH)
        env:
          DEPDASH_SSH_KEY: ${{ secrets.DEPDASH_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/depdash_deploy_key
          echo "$DEPDASH_SSH_KEY" > /tmp/depdash_deploy_key
          ssh -i /tmp/depdash_deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.DEPDASH_SSH_PORT || 22 }} \
            "${{ secrets.DEPDASH_SSH_USER }}@${{ secrets.DEPDASH_SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPDASH_DEPLOY_PATH }}'"
          scp -i /tmp/depdash_deploy_key -o StrictHostKeyChecking=no -P ${{ secrets.DEPDASH_SSH_PORT || 22 }} \
            artifact.tar.gz "${{ secrets.DEPDASH_SSH_USER }}@${{ secrets.DEPDASH_SSH_HOST }}:${{ secrets.DEPDASH_DEPLOY_PATH }}/artifact.tar.gz"
          ssh -i /tmp/depdash_deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.DEPDASH_SSH_PORT || 22 }} \
            "${{ secrets.DEPDASH_SSH_USER }}@${{ secrets.DEPDASH_SSH_HOST }}" \
            "cd '${{ secrets.DEPDASH_DEPLOY_PATH }}' && tar -xzf artifact.tar.gz && (pm2 reload '${{ secrets.DEPDASH_PM2_APP }}' || pm2 start 'export NVM_DIR="/home/oesadmin/.nvm"
source ~/.nvm/nvm.sh 
pm2 describe deprunner.customerdemourl.com > /dev/null \
  && pm2 reload deprunner.customerdemourl.com --update-env \
  || pm2 start app.js --name deprunner.customerdemourl.com --time

pm2 save' --name '${{ secrets.DEPDASH_PM2_APP }}' --interpreter bash)"
          rm -f /tmp/depdash_deploy_key
      - name: Notify depdash
        env:
          DEPDASH_CALLBACK_SECRET: ${{ secrets.DEPDASH_CALLBACK_6EE72A0C_F037_4397_BAC9_2758558F5335 }}
        run: |
          BODY=$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg status "success" --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{ runId: $run, gitSha: $sha, status: $status, runUrl: $runurl }')
          SIG=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$DEPDASH_CALLBACK_SECRET" -binary | xxd -p -c 256)
          curl -fsS -X POST -H "content-type: application/json" -H "x-depdash-sig: sha256=$SIG" -d "$BODY" 'http://localhost:3000/webhooks/ci-result?pipelineId=6ee72a0c-f037-4397-bac9-2758558f5335'
